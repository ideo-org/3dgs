[project]
name = "3dgs-lidar"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "numpy<2",
    "scipy>=1.10",
    "Pillow>=9.0",
    "plyfile>=0.8",
    "tqdm>=4.60",
    "diff-gaussian-rasterization",
    "simple-knn",
    "fused-ssim",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]
diff-gaussian-rasterization = { path = "../diff-gaussian-rasterization", editable = true }
simple-knn = { path = "../simple-knn", editable = true }
fused-ssim = { path = "../fused-ssim", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = ["torch"]
simple-knn = ["torch"]
fused-ssim = ["torch"]
